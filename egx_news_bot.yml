name: EGX Daily News Bot

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Send now regardless of day/time (for testing)"
        required: false
        default: "false"

concurrency:
  group: egx-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Quick time check
        id: timecheck
        run: |
          RESULT=$(python3 check_window.py)
          echo "proceed=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Current check: proceed=$RESULT"

      - name: Set up Python
        if: steps.timecheck.outputs.proceed == 'true' || github.event.inputs.force_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        if: steps.timecheck.outputs.proceed == 'true' || github.event.inputs.force_run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.timecheck.outputs.proceed == 'true' || github.event.inputs.force_run == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run EGX news bot
        if: steps.timecheck.outputs.proceed == 'true' || github.event.inputs.force_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '0' }}
        run: python egx_news_bot.py

      - name: Commit updated state file (if changed)
        if: steps.timecheck.outputs.proceed == 'true' || github.event.inputs.force_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_state.json
          git diff --cached --quiet || git commit -m "Update sent articles state [skip ci]"
          git push
