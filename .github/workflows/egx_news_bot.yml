name: EGX Daily News Bot

on:

   
  workflow_dispatch:
    inputs:
      force_run:
        description: "Send now regardless of day/time (for testing)"
        required: false
        default: "false"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run EGX news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '0' }}
        run: python egx_news_bot.py

      # --- الخطوة الجديدة المضافة لحل مشكلة التكرار وظهور ملف الـ JSON ---
      - name: Commit and Push state changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # التحقق من وجود الملف قبل محاولة رفعه لتجنب الأخطاء
          if [ -f sent_state.json ]; then
            git add sent_state.json
            git commit -m "Update sent_state.json with latest processed news [skip ci]" || echo "No changes to commit"
            git push
          fi
